services:
  web_service:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://{PSQL_USER}:{PSQL_PASSWORD}@database:5432/${PRODUCTS_DATABASE_URL}
      - DEBUG=False
    depends_on:
      - database
      - redis
    develop:
      watch:
        - action: sync+restart
          path: .
          target: /code
        - action: rebuild
          path: requirements.txt
    restart: unless-stopped

  database:
    image: postgres:15
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${PSQL_USER}
      - POSTGRES_PASSWORD=${PSQL_PASSWORD}
      - PRODUCTS_DATABASE_URL=${PRODUCTS_DATABASE_URL}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  redis:
    image: redis:alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
  redis-data:
