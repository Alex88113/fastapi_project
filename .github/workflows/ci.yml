name: Docker Compose CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build containers
        run: docker compose build

      - name: Start containers
        run: docker compose up -d

      - name: Wait for services to be ready healthy
        run: |
          for i in $(seq 1 30); do
             unhealthy=$(docker compose ps | grep -c "unhealthy" || true)
             starting=$(docker compose ps | grep -c "starting" || true)
             if [ "$unhealthy" -gt 0 ]; then
               echo "All services unhealthy"; docker compose ps; exit 1
             fi
             if [ "starting" -eq 0 ]; then
               echo "All services ready"; docker compose exit 0
             fi
             echo "Waiting for services... ($i/30)"
             sleep 2
          done
          echo "timeout waiting for services"; docker compose ps; exit 1

      - name: Run tests
        run: docker compose exec -T app pytest -v

      - name: Stop containers
        if: always()
        run: docker compose down -v
